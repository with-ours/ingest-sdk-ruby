name: CI
on: [push, pull_request]

permissions: {}

env:
  BUNDLE_FROZEN: "true"

jobs:
  lint:
    permissions:
      contents: read
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: false
      - run: |-
          bundle install

      - name: Run lints
        run: ./scripts/lint
  test-matrix:
    permissions:
      contents: read
    timeout-minutes: 10
    name: test (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3.13", "3.4.12", "4.0.9"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - run: |-
          bundle install

      - name: Run tests
        run: ./scripts/test

      - name: Build gem
        run: bundle exec rake build:gem

  # Stable required-check name; matrix legs above include versions in their names.
  test:
    name: test
    needs: [test-matrix]
    if: always()
    permissions: {}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix legs
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: |
          echo "test-matrix: $RESULT"
          [ "$RESULT" = "success" ]

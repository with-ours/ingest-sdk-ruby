name: Publish Gem

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish
        required: true
        type: string
      commit:
        description: Full release commit SHA already merged into main
        required: true
        type: string
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Builds the gem with read-only permissions. This job cannot mint an OIDC token,
  # so nothing that runs here can reach the RubyGems credential.
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.title, 'release: '))
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      gem: ${{ steps.build.outputs.gem }}
      sha256: ${{ steps.build.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.commit }}

      - name: Validate release version and commit
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha || inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            RELEASE_VERSION="${PR_TITLE#release: }"
          else
            RELEASE_VERSION="$INPUT_VERSION"
          fi
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic release version" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full release commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"
          test "$(jq -er '.["."]' .release-please-manifest.json)" = "$RELEASE_VERSION"
          TAG="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: false

      # No `bundle install` anywhere in this workflow: the gemspec needs no
      # development gems, so no third-party gem code (extconf.rb, Rakefile
      # requires) runs on the release path. This step produces the same gem as
      # `rake build:gem`, which cannot be used here because the Rakefile
      # requires development gems.
      - name: Build gem
        id: build
        run: |
          set -euo pipefail
          printf 'rbi/*\nsig/*\n' > .ignore
          gem build oursprivacy_ingest.gemspec
          shopt -s nullglob
          gems=(*.gem)
          if [[ "${#gems[@]}" -ne 1 ]]; then
            echo "Expected exactly one built gem, found ${#gems[@]}" >&2
            exit 1
          fi
          echo "gem=${gems[0]}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${gems[0]}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload gem
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: ${{ steps.build.outputs.gem }}
          if-no-files-found: error
          retention-days: 7

  # Pushes the gem built above. The `release` environment only accepts runs from
  # the default branch, and the RubyGems trusted publisher is registered against
  # that environment, so a workflow edited on any other branch cannot publish.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}

    steps:
      # Needed for tagging only. Nothing from the checkout is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: false

      - name: Download gem
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: ${{ runner.temp }}/gem

      - name: Verify gem checksum
        env:
          GEM_FILE: ${{ runner.temp }}/gem/${{ needs.build.outputs.gem }}
          GEM_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$GEM_SHA256  $GEM_FILE" | sha256sum --check --strict

      # Trusted publishing: RubyGems.org exchanges this job's OIDC token for a
      # short-lived API key under the publisher registered for this repository,
      # workflow and environment.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems.org
        env:
          GEM_FILE: ${{ runner.temp }}/gem/${{ needs.build.outputs.gem }}
        run: |
          set -euo pipefail
          gem push "$GEM_FILE"

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
            git -c credential.helper='!gh auth git-credential' push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --target "$RELEASE_COMMIT" --generate-notes --title "$TAG"
          fi

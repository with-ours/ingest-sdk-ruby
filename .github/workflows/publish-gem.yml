name: Publish Gem

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish
        required: true
        type: string
      commit:
        description: Full release commit SHA already merged into main
        required: true
        type: string
  pull_request:
    types: [closed]

permissions: {}

jobs:
  # Starts this workflow on the default branch when a release PR merges.
  dispatch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.title, 'release: ')
    name: dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${PR_TITLE#release: }"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-gem.yml/dispatches" \
            -f "ref=$DEFAULT_BRANCH" \
            -f "inputs[version]=$RELEASE_VERSION" \
            -f "inputs[commit]=$RELEASE_COMMIT"
          echo "Dispatched publish-gem.yml on $DEFAULT_BRANCH for $RELEASE_VERSION at $RELEASE_COMMIT"

  # Validates the release and builds the gem.
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      gem: ${{ steps.build.outputs.gem }}
      sha256: ${{ steps.build.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release version and commit
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${INPUT_VERSION#v}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic release version" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full release commit SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"
          git checkout --quiet --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(jq -er '.["."]' .release-please-manifest.json)" = "$RELEASE_VERSION"
          TAG="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler: none
          bundler-cache: false

      # Same output as `rake build:gem`.
      - name: Build gem
        id: build
        run: |
          set -euo pipefail
          printf 'rbi/*\nsig/*\n' > .ignore
          gem build oursprivacy_ingest.gemspec
          shopt -s nullglob
          gems=(*.gem)
          if [[ "${#gems[@]}" -ne 1 ]]; then
            echo "Expected exactly one built gem, found ${#gems[@]}" >&2
            exit 1
          fi
          echo "gem=${gems[0]}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${gems[0]}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload gem
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: ${{ steps.build.outputs.gem }}
          if-no-files-found: error
          retention-days: 7

  # Pushes the built gem, then tags and creates the GitHub Release.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}

    steps:
      # Needed for tagging.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler: none
          bundler-cache: false

      - name: Download gem
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: ${{ runner.temp }}/gem

      - name: Verify gem checksum
        env:
          GEM_FILE: ${{ runner.temp }}/gem/${{ needs.build.outputs.gem }}
          GEM_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$GEM_SHA256  $GEM_FILE" | sha256sum --check --strict

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # Skips the push when RubyGems.org already serves this exact file, so the job can be re-run.
      - name: Publish to RubyGems.org
        env:
          GEM_FILE: ${{ runner.temp }}/gem/${{ needs.build.outputs.gem }}
          GEM_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          published="$(curl -fsS --retry 3 https://rubygems.org/api/v1/versions/oursprivacy-ingest.json || echo '[]')"
          if jq -e --arg sha "$GEM_SHA256" 'any(.[]; .sha == $sha)' <<<"$published" >/dev/null; then
            echo "RubyGems.org already serves this gem (sha256 $GEM_SHA256); skipping push"
          else
            gem push "$GEM_FILE"
          fi

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
            git -c credential.helper='!gh auth git-credential' push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --target "$RELEASE_COMMIT" --generate-notes --title "$TAG"
          fi

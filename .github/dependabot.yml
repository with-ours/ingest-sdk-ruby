# Keep GitHub Actions and SDK dependencies up to date.
# Match the weekly update policy used by the Node.js SDKs.
#
# Bundler updates resolve against the lowest Ruby allowed by the gemspec's
# required_ruby_version, so raising that floor is what unblocks gems that
# need a newer Ruby. Dependabot does not update Ruby itself: bump
# .ruby-version and the CI test matrix by hand.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  cooldown:
    default-days: 7
  open-pull-requests-limit: 5
  labels:
  - dependencies
  commit-message:
    prefix: fix
  groups:
    actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: bundler
  directory: /
  schedule:
    interval: weekly
    day: monday
  cooldown:
    default-days: 7
  open-pull-requests-limit: 5
  labels:
  - dependencies
  commit-message:
    prefix: fix
    prefix-development: chore
  groups:
    all-deps:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
